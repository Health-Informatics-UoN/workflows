name: Claude PR Review (self)

on:
  pull_request:
    # labeled: adding the claude-review label requests a review.
    types: [opened, synchronize, ready_for_review, labeled]

permissions: {}

jobs:
  claude:
    # ./ matches the other callers here. For a job-level call to a workflow in the same
    # repository, ./ and $/ both load it from the same commit, before any step runs.
    # Moving every same-repository call to $/ will be done together in a separate PR,
    # which will also remove this ignore.
    uses: ./.github/workflows/claude-review.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      pull-requests: write
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
