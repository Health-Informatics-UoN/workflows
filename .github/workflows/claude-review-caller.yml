name: Claude PR Review (self)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions: {}

jobs:
  claude:
    uses: ./.github/workflows/claude-review.yml
    permissions:
      contents: read
      pull-requests: write
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
