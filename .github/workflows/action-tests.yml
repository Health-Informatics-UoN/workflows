# This workflow runs the unit tests for the Claude review action. It is
# a self-check, not a reusable workflow. The tests use a fake GitHub and a fake Claude
# Code, so they need no secrets.
name: Action Tests

on:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/action-tests.yml"
      - ".github/workflows/claude-review.yml"  # the defaults test reads it
  push:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - ".github/workflows/action-tests.yml"
      - ".github/workflows/claude-review.yml"  # the defaults test reads it

permissions:
  contents: read

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Run the Claude review action tests
        working-directory: .github/actions/claude-review
        run: uv run --frozen pytest
