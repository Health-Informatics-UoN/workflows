# This workflow runs the unit tests for the Claude review action. It is
# a self-check, not a reusable workflow. The tests use fake gh and claude commands, so
# they need no secrets.
name: Action Tests

on:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/action-tests.yml"
  push:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - ".github/workflows/action-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run the Claude review action tests
        run: bats .github/actions/claude-review/tests
