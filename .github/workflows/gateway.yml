# Validates a dataset repo's HDR UK Gateway metadata and, with `publish: true`, publishes
# it as a new version of the dataset. Call it without inputs on pull requests (no secrets
# needed), with `publish: true` after semantic-release creates a release, and once with
# `create: true` from a manual workflow to create the dataset. See docs/workflows/gateway.md.
name: HDR UK Gateway

on:
  workflow_call:
    inputs:
      publish:
        description: Publish after validating. Needs the secrets and an existing dataset_id in gateway.yaml.
        type: boolean
        default: false
      create:
        description: Create the dataset on the Gateway instead of publishing, once per dataset. Prints the dataset_id and pid to add to gateway.yaml.
        type: boolean
        default: false
      version:
        description: Metadata version, major.minor.patch (a leading v is removed). Pass the release tag; required to publish or create.
        type: string
        default: ""
      dataset-dir:
        description: Directory holding gateway/.
        type: string
        default: "."
      schema:
        description: LinkML schema. Default the only *.yaml in dataset-dir, else in dataset-dir/schemas.
        type: string
        default: ""
      status:
        description: DRAFT or ACTIVE. Default the status in gateway.yaml.
        type: string
        default: ""
      dry-run:
        description: Print the publish request instead of sending it.
        type: boolean
        default: false
      environment:
        description: GitHub environment for the publish and create job; give it required reviewers.
        type: string
        default: gateway
      base-url:
        description: Gateway API base URL.
        type: string
        default: https://api.healthdatagateway.org/api
      traser:
        description: Validate with TRASER. false skips validation.
        type: boolean
        default: true
      traser-url:
        description: TRASER base URL.
        type: string
        default: https://hdr-gateway-traser-dev-qmnkcg5qjq-ew.a.run.app
    secrets:
      # Optional so PR checks and dry runs work without them. With `secrets: inherit` the
      # publish job uses the environment's secrets of these names.
      GATEWAY_APP_ID:
        required: false
      GATEWAY_CLIENT_ID:
        required: false

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # $/ is this workflow's repository at the commit that runs, so the action matches
      # the version of the workflow the caller pinned.
      - uses: $/.github/actions/gateway-publish
        with:
          command: validate
          dataset-dir: ${{ inputs.dataset-dir }}
          schema: ${{ inputs.schema }}
          version: ${{ inputs.version }}
          base-url: ${{ inputs.base-url }}
          traser: ${{ inputs.traser }}
          traser-url: ${{ inputs.traser-url }}

  publish:
    if: inputs.publish || inputs.create
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    concurrency:
      group: gateway-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check inputs
        if: inputs.publish && inputs.create
        run: |
          echo "::error::Set publish or create, not both"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/gateway-publish
        with:
          command: ${{ inputs.create && 'create' || 'push' }}
          dataset-dir: ${{ inputs.dataset-dir }}
          schema: ${{ inputs.schema }}
          version: ${{ inputs.version }}
          status: ${{ inputs.status }}
          dry-run: ${{ inputs.dry-run }}
          base-url: ${{ inputs.base-url }}
          traser: ${{ inputs.traser }}
          traser-url: ${{ inputs.traser-url }}
          app-id: ${{ secrets.GATEWAY_APP_ID }}
          client-id: ${{ secrets.GATEWAY_CLIENT_ID }}
