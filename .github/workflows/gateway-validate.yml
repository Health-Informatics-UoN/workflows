# Checks a dataset repo's HDR UK Gateway metadata without publishing anything. Call it on
# pull requests (see samples/check.gateway.yaml). It needs no secrets, so it is safe for
# PRs from forks and Dependabot.
#
# It builds the metadata from the LinkML schema and gateway/metadata.yaml, validates it
# against the HDRUK 4.1.0 schema, and (by default) sends it to HDR UK's TRASER service,
# which the Gateway uses and which catches errors the schema alone misses. TRASER receives
# the metadata, which is published anyway.
name: HDR UK Gateway Validate

on:
  workflow_call:
    inputs:
      dataset-dir:
        description: Directory holding gateway/ (default the repository root).
        type: string
        default: "."
      schema:
        description: LinkML schema. Default the only *.yaml in dataset-dir, else in dataset-dir/schemas.
        type: string
        default: ""
      traser:
        description: Also check the metadata with TRASER, as the Gateway does.
        type: boolean
        default: true
      traser-url:
        description: TRASER base URL. Default HDR UK's dev instance.
        type: string
        default: ""

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # $/ is the repository of this workflow, at the commit that runs, so the action is
      # the same version as the workflow that the caller pinned.
      - name: Validate Gateway metadata
        uses: $/.github/actions/gateway-publish
        with:
          command: validate
          dataset-dir: ${{ inputs.dataset-dir }}
          schema: ${{ inputs.schema }}
          traser: ${{ inputs.traser }}
          traser-url: ${{ inputs.traser-url }}
