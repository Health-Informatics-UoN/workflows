version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "fix(dependencies): "
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
          - "major"
    ignore:
      # A stray v2026.6.0 tag (never a release) pointed at a commit older than v3.0.0, and
      # Dependabot treated it as newer, downgrading us in #44.
      # See https://github.com/tyriis/docker-image-tag-exists/issues/176
      - dependency-name: "tyriis/docker-image-tag-exists"
        versions: [">= 2026"]

  # Claude Code CLI used by the Claude review action (package-lock.json)
  - package-ecosystem: "npm"
    directory: "/.github/actions/claude-review"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait a week before proposing a new release, so a compromised release
    # that gets pulled quickly never reaches this repo.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix(dependencies): "
