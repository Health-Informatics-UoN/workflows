version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "fix(dependencies): "
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
          - "major"
    ignore:
      # A stray v2026.6.0 tag (never a release) pointed at a commit older than v3.0.0, and
      # Dependabot treated it as newer, downgrading us in #44.
      # See https://github.com/tyriis/docker-image-tag-exists/issues/176
      - dependency-name: "tyriis/docker-image-tag-exists"
        versions: [">= 2026"]


