version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" includes the workflows in .github/workflows. The list also has the actions
    # in .github/actions/*. Thus, Dependabot also updates the actions that they use (for
    # example, setup-node).
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "fix(dependencies): "
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
          - "major"
    ignore:
      # A stray v2026.6.0 tag (never a release) pointed at a commit older than v3.0.0, and
      # Dependabot treated it as newer, downgrading us in #44.
      # See https://github.com/tyriis/docker-image-tag-exists/issues/176
      - dependency-name: "tyriis/docker-image-tag-exists"
        versions: [">= 2026"]

  # This entry updates the Python dependencies of the Claude review action (uv.lock).
  - package-ecosystem: "uv"
    directory: "/.github/actions/claude-review"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix(dependencies): "

  # This entry updates the Claude Code CLI that the Claude review action uses
  # (package-lock.json).
  - package-ecosystem: "npm"
    directory: "/.github/actions/claude-review"
    schedule:
      interval: "monthly"
    # Wait one week before Dependabot proposes a new release. Thus, if a release is
    # compromised and quickly removed, the release never gets to this repo.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix(dependencies): "
