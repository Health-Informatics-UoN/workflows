[project]
name = "gateway-publish"
version = "0.1.0"
description = "Publish dataset metadata to the HDR UK Health Data Research Gateway"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "linkml-runtime>=1.12.1",
    "pydantic>=2",
    "pyyaml>=6.0.3",
]

[project.scripts]
gateway-publish = "gateway_publish.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_publish"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
