name: Claude PR review
description: >-
  Reviews a pull request with Claude Code, read-only, and posts the findings as
  inline comments plus a summary comment. Run it on pull_request events, after
  checking out the PR.

inputs:
  anthropic-api-key:
    description: >-
      Claude Console API key. The API credits included with Claude Team and Max
      plans cover this (`claude -p` run with an API key is billed as Agent SDK
      usage); they don't cover anthropics/claude-code-action, which is why this
      action runs the CLI directly. https://support.claude.com/en/articles/17154008
    required: true
  github-token:
    description: Token used to read the PR and post comments. Needs pull-requests write.
    default: ${{ github.token }}
  model:
    description: Claude model to use.
    default: claude-opus-5-5
  # The two limits go together: Claude spends turns reading files, so a larger PR
  # needs more turns. Running out of turns fails the review.
  max-turns:
    description: Maximum number of Claude turns per review; limits cost.
    default: "25"
  max-lines:
    description: Skip PRs with more changed lines (additions + deletions) than this.
    default: "2000"

runs:
  using: composite
  steps:
    - name: Check PR size
      id: size
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        ADDITIONS: ${{ github.event.pull_request.additions }}
        DELETIONS: ${{ github.event.pull_request.deletions }}
        MAX_LINES: ${{ inputs.max-lines }}
      run: bash "$GITHUB_ACTION_PATH/check-size.sh"

    # Fetched here so the Claude step has no GitHub token and no shell. Comments
    # aren't fetched: anyone can post them, so they could carry injected instructions.
    # The exception is replies to this action's earlier findings (threads a bot account
    # started), and only replies from people with access to the repository (see
    # fetch-discussed.sh).
    - name: Fetch PR
      if: steps.size.outputs.too-large == 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        bash "$GITHUB_ACTION_PATH/fetch-pr.sh"
        bash "$GITHUB_ACTION_PATH/fetch-discussed.sh"

    # Claude Code needs Node 22 or later. Set it here rather than relying on the runner
    # image's default, which changes over time (Ubuntu 24.04 images defaulted to Node 20)
    # and may be missing on self-hosted runners.
    - name: Set up Node.js
      if: steps.size.outputs.too-large == 'false'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # Installs the Claude Code version pinned in package-lock.json, checking every
    # package against its recorded checksum. Dependabot proposes updates.
    - name: Install Claude Code
      if: steps.size.outputs.too-large == 'false'
      shell: bash
      run: npm ci --prefix "$GITHUB_ACTION_PATH" --no-audit --no-fund

    - name: Run Claude review
      if: steps.size.outputs.too-large == 'false'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        MODEL: ${{ inputs.model }}
        MAX_TURNS: ${{ inputs.max-turns }}
      run: bash "$GITHUB_ACTION_PATH/review.sh"

    - name: Post review comments
      if: steps.size.outputs.too-large == 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash "$GITHUB_ACTION_PATH/post.sh"
