# Sample release workflow for a dataset repo that publishes to the HDR UK Gateway.
# semantic-release decides the version; if it created a release, the metadata is
# published as a new Gateway version after a reviewer approves the `gateway` environment.
# See docs/workflows/gateway-publish.md for the one-off setup (environment, secrets,
# gateway/ files, creating the dataset).
# Pin both workflows to the same release of health-informatics-uon/workflows.

name: Release
permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  push:
    branches:
      - main

jobs:
  release:
    uses: health-informatics-uon/workflows/.github/workflows/semantic-release.yml@main
    with:
      node-version: "24"
    secrets: inherit

  gateway:
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: health-informatics-uon/workflows/.github/workflows/gateway-publish.yml@main
    permissions:
      contents: read
    with:
      # Release tag from semantic-release (do not change)
      version: ${{ needs.release.outputs.release-tag }}
    # Gives the publish job the `gateway` environment's GATEWAY_APP_ID and
    # GATEWAY_CLIENT_ID secrets. To use repository secrets instead, pass them by name:
    #   secrets:
    #     GATEWAY_APP_ID: ${{ secrets.GATEWAY_APP_ID }}
    #     GATEWAY_CLIENT_ID: ${{ secrets.GATEWAY_CLIENT_ID }}
    secrets: inherit
